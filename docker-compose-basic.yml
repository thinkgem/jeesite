# 第一步，编译项目：sh ./bin/package.sh
# 第二步，运行基础服务：sh ./bin/docker-compose-basic.sh
# 第三步，运行平台服务：sh ./bin/docker-compose-service.sh
#
name: jeesite-cloud-basic

# ==================== Environment ====================
x-common-env: &common-env
  TZ: Asia/Shanghai
  LANG: C.UTF-8
  MYSQL_HOST: jeesite-cloud-mysql
  REDIS_HOST: jeesite-cloud-redis
  NACOS_HOST: jeesite-cloud-nacos

# ==================== Service Base ====================
x-service-base: &service-base
  image: docker.1ms.run/eclipse-temurin:21.0.10_7-jdk
  working_dir: /app
  command: >
    sh -c "if [ ! -d 'web' ]; then mkdir web && cp web.war web && cd web && jar -xvf web.war && 
    rm web.war && cd ..; fi && cd web/WEB-INF && exec sh startup.sh"
  #restart: unless-stopped
  networks:
    - jeesite-cloud-network

services:

  # ==================== MySQL ====================
  jeesite-cloud-mysql:
    <<: *service-base
    container_name: jeesite-cloud-mysql
    image: docker.1ms.run/library/mysql:8.4.10
    ports:
      - "23306:3306"
    environment:
      <<: *common-env
      MYSQL_ROOT_HOST: "%"
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: nacos
    volumes:
      - ./.docker/mysql/log:/var/log/mysql
      - ./.docker/mysql/data:/var/lib/mysql
      - ./.docker/mysql/conf:/etc/mysql/conf.d
      - ./nacos/db/mysql/create_user.sql:/docker-entrypoint-initdb.d/01_nacos_create_user.sql
      - ./nacos/src/main/resources/META-INF/mysql-schema.sql:/docker-entrypoint-initdb.d/02_nacos.sql
      - ./modules/core/core/db/mysql/create_user.sql:/docker-entrypoint-initdb.d/03_core_create_user.sql
      #- ../jeesite-cloud-/modules/seata/seata/script/server/db/mysql.sql:/docker-entrypoint-initdb.d/04_seata.sql
    command: >
      sh -c "ln -snf /usr/share/zoneinfo/$${TZ} /etc/localtime && 
      echo $${TZ} > /etc/timezone && docker-entrypoint.sh mysqld"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p123456"]
      interval: 5s
      timeout: 5s
      retries: 99

  # ==================== Redis ====================
  jeesite-cloud-redis:
    <<: *service-base
    container_name: jeesite-cloud-redis
    image: docker.1ms.run/valkey/valkey:9.1.0
    ports:
      - "26379:6379"
    environment:
      <<: *common-env
      REDISCLI_AUTH: 1234
    volumes:
      - ./.docker/redis/data:/data
    command: redis-server --requirepass 1234
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 99

  # ==================== Nacos ====================
  jeesite-cloud-nacos:
    <<: *service-base
    container_name: jeesite-cloud-nacos
    ports:
      - "8848:8848"
      - "9848:9848"
      - "8849:8849"
    environment:
      <<: *common-env
      JAVA_OPTS: -Dspring.profiles.active=prod -Dnacos.home=/nacos
    volumes:
      - ./.docker/nacos:/nacos
      - ./nacos/target:/app
      - ./nacos/db/config/jeesite-cloud-yml.zip:/app/jeesite-cloud-yml.zip
    depends_on:
      jeesite-cloud-mysql:
        condition: service_healthy
      jeesite-cloud-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8849"]
      interval: 5s
      timeout: 5s
      retries: 99

# ==================== Networks ====================
networks:
  jeesite-cloud-network:
    name:  jeesite-cloud-network
    driver: bridge
